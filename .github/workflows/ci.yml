name: CI

on: [push, pull_request]

jobs:
  build:
    name: Compile project
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Automake
        run: |
          cd src
          autoreconf -i -W none

      - name: Configure & build
        run: |
          cd build
          ../src/configure
          make -j3


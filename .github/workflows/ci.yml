name: CI

on: [push, pull_request]

jobs:
  build:
    name: Compile project
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Turn on test-bin
        run: |
          cd osm-3s_testing
          ./turn_testing_on.sh

      - name: Automake
        run: |
          cd src
          autoreconf -i -W none

      - name: Configure & build
        run: |
          cd build
          # With _GLIBCXX_ASSERTIONS, out-of-bounds indexing into strings and
          # vectors aborts instead of reading past the end unnoticed.
          ../src/configure --prefix="$GITHUB_WORKSPACE" \
              CXXFLAGS="-g -O1 -fno-omit-frame-pointer -fsanitize=address -D_GLIBCXX_ASSERTIONS" \
              LDFLAGS="-fsanitize=address"
          make -j"$(nproc)" install

      - name: Run the test suites
        env:
          ASAN_OPTIONS: log_path=/tmp/asan/asan:detect_leaks=0:abort_on_error=0
        run: |
          mkdir -p /tmp/asan
          cd osm-3s_testing
          ../test-bin/run_testsuite.sh 40 2>&1 | tee ../testsuite.log
          echo "Tests reporting success: $(grep -c ' succeeded\.$' ../testsuite.log)"
          if grep -q 'the tests haven.t compiled' ../testsuite.log \
              || ! grep -q ' succeeded\.$' ../testsuite.log; then
            echo "::error::The test suites did not run"
            exit 1
          fi
          # Most suites report "Test X N FAILED." and diff -q's "Files A and B differ";
          # the attic, vlt and implicit areas suites only report the latter.
          if grep -E " FAILED\.$| differ$|doesn't exist\.$|^In Test .*Unexpected file" ../testsuite.log; then
            echo "::error::Some tests failed"
            exit 1
          fi

      - name: ASan reports
        if: always()
        run: |
          ls /tmp/asan 2>/dev/null | wc -l | sed 's/^/ASan report files: /'
          cat /tmp/asan/* 2>/dev/null | grep -h "^SUMMARY: AddressSanitizer" | sort | uniq -c | sort -rn | head -50
          for f in $(ls /tmp/asan 2>/dev/null | head -5); do echo "===== $f"; head -60 "/tmp/asan/$f"; done

      - name: Upload the outputs of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-tests
          path: |
            testsuite.log
            osm-3s_testing/run/
            /tmp/asan/
          if-no-files-found: ignore
